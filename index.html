<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>编钟 · 木鱼 · 鼓</title>
<style>
  :root {
    --page-bg: #2a2218;
    --case-1: #8a6e3c;
    --case-2: #6b542c;
    --case-3: #4a3a1e;
    --panel-1: #5c4a2a;
    --panel-2: #4a3a1e;
    --text: #e8d5a8;
    --text-dim: #b8a070;
    --border: rgba(200,170,100,0.22);
    --recess: rgba(0,0,0,0.45);
    --unit-shadow: rgba(0,0,0,0.55);
    --hi: rgba(255,230,160,0.18);
    --bronze-high: #d4a84a;
    --bronze-mid: #b8863f;
    --bronze-low: #8a6528;
    --wood: #a86e3a;
    --red: #a84838;
    --accent: #c9a050;
    --focus: #d4b060;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse 600px 260px at 50% -4%, rgba(180,140,60,0.12), transparent 55%),
      var(--page-bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 10px 6px 18px;
    max-width: 600px;
    margin: 0 auto;
  }
  h1 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.06em;
    margin: 0 0 1px;
    text-align: center;
    color: var(--bronze-high);
  }
  .tagline { color: var(--text-dim); font-size: 10px; margin: 0 0 10px; text-align: center; }
  button { font-family: inherit; border: none; cursor: pointer; color: var(--text); background: none; }
  button:focus-visible, .step:focus-visible, input:focus-visible {
    outline: 1.5px solid var(--focus); outline-offset: 1px;
  }

  .unit {
    position: relative;
    background: linear-gradient(160deg, var(--case-1) 0%, var(--case-2) 50%, var(--case-3) 100%);
    border-radius: 14px;
    padding: 12px 8px 10px;
    box-shadow: 0 12px 24px -8px var(--unit-shadow), inset 0 1px 0 var(--hi);
    border: 1px solid rgba(180,140,60,0.25);
  }
  .screw {
    position: absolute;
    width: 6px; height: 6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--bronze-high), var(--bronze-low) 80%);
    box-shadow: 0 1px 1px rgba(0,0,0,.5), inset 0 0 1px var(--hi);
  }
  .screw::after {
    content: ""; position: absolute; top: 48%; left: 15%; right: 15%; height: 1px;
    background: rgba(0,0,0,.5); transform: rotate(24deg);
  }
  .screw.tl { top: 6px; left: 6px; }
  .screw.tr { top: 6px; right: 6px; }
  .screw.bl { bottom: 6px; left: 6px; }
  .screw.br { bottom: 6px; right: 6px; }

  .panel {
    background: linear-gradient(180deg, var(--panel-1), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: inset 0 1px 3px var(--recess), inset 0 -1px 0 var(--hi);
    padding: 8px;
    margin-bottom: 6px;
  }

  .btn3d {
    background: linear-gradient(160deg, var(--case-1), var(--case-2));
    border: 1px solid var(--border);
    border-radius: 5px;
    box-shadow: 0 2px 0 var(--case-3), 0 2px 4px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
    transition: transform .07s ease, box-shadow .07s ease;
    color: var(--text-dim);
  }
  .btn3d:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 var(--case-3), inset 0 2px 3px rgba(0,0,0,.35);
  }
  .btn3d.on {
    background: linear-gradient(160deg, var(--accent), var(--bronze-low));
    color: #2a1e0c;
    box-shadow: 0 0 0 var(--case-3), inset 0 2px 3px rgba(0,0,0,.3);
    transform: translateY(1px);
  }

  .pads-panel .section-label { font-size: 10px; color: var(--text-dim); margin: 0 0 5px; }
  .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .pad {
    --glow: var(--text-dim);
    position: relative; aspect-ratio: 1.6; border-radius: 7px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: transform .07s ease, box-shadow .07s ease;
    touch-action: manipulation;
  }
  .pad .kbd { position: absolute; top: 2px; left: 4px; font-size: 8px; opacity: 0.55; }
  .pad .name { font-size: 10px; font-weight: 700; }
  .pad:active { transform: translateY(1px) scale(0.97); }
  .pad.bell {
    --glow: var(--bronze-mid);
    background: radial-gradient(circle at 32% 28%, var(--bronze-high), var(--bronze-low) 130%);
    box-shadow: 0 2px 0 var(--bronze-low), 0 2px 5px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
    color: #2a1c08;
  }
  .pad.wood {
    --glow: var(--wood);
    background: linear-gradient(160deg, #c49050, var(--wood) 140%);
    box-shadow: 0 2px 0 #6a4020, 0 2px 5px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
    color: #2a1808;
  }
  .pad.drum {
    --glow: var(--red);
    background: linear-gradient(160deg, #c07060, var(--red) 140%);
    box-shadow: 0 2px 0 #6a2818, 0 2px 5px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
    color: #2a0c08;
  }

  @keyframes ringPulse {
    0%   { box-shadow: 0 0 0 0 var(--glow), 0 2px 0 rgba(0,0,0,.2); }
    100% { box-shadow: 0 0 0 8px transparent, 0 2px 0 rgba(0,0,0,0); }
  }
  .pulse { animation: ringPulse .35s ease-out; }

  .transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #playBtn {
    --glow: var(--red);
    width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #d08070, var(--red) 130%);
    color: #2a0c08;
    font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 2px 0 #6a2818, 0 3px 6px rgba(0,0,0,.35), inset 0 1px 0 var(--hi);
    transition: transform .07s ease, box-shadow .07s ease;
  }
  #playBtn:active { transform: translateY(2px); box-shadow: 0 0 0 #6a2818, inset 0 2px 3px rgba(0,0,0,.35); }
  .tempo-wrap { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 110px; }
  .tempo-wrap label { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .tempo-wrap input[type="range"] { flex: 1; }
  #tempoVal { font-size: 10px; font-variant-numeric: tabular-nums; width: 48px; text-align: right; color: var(--text-dim); }
  .ghost-btn { padding: 5px 8px; font-size: 10px; }

  .subrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 10px; color: var(--text-dim); }
  .slots { display: flex; gap: 3px; }
  .slot-btn { width: 22px; height: 22px; border-radius: 5px; font-size: 10px; font-weight: 700; }
  .feel-wrap { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 90px; }
  .feel-wrap input[type="range"] { flex: 1; }

  details.mixer summary {
    cursor: pointer; font-size: 10px; color: var(--text-dim); list-style: none;
    display: flex; align-items: center; gap: 4px; margin: -2px -2px 0;
  }
  details.mixer summary::-webkit-details-marker { display: none; }
  details.mixer summary::before { content: "▸"; font-size: 8px; }
  details.mixer[open] summary::before { content: "▾"; }
  .mixer-grid { margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
  .mixer-row { display: grid; grid-template-columns: 52px 1fr 28px; align-items: center; gap: 5px; }
  .mixer-row .m-label { font-size: 10px; color: var(--text-dim); }
  .mixer-row.bell .m-label { color: var(--bronze-mid); }
  .mixer-row.wood .m-label { color: var(--wood); }
  .mixer-row.drum .m-label { color: var(--red); }
  .mixer-row .m-val { font-size: 9px; color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; }
  .mixer-divider { height: 1px; background: var(--border); margin: 1px 0; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 3px; border-radius: 2px; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(180deg, var(--case-3), var(--case-2));
    box-shadow: inset 0 1px 2px var(--recess);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px; border-radius: 50%; margin-top: -4.5px;
    background: radial-gradient(circle at 35% 28%, var(--bronze-high), var(--bronze-low) 85%);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 1px var(--hi);
  }
  input[type="range"]::-moz-range-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(180deg, var(--case-3), var(--case-2));
    box-shadow: inset 0 1px 2px var(--recess);
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border);
    background: radial-gradient(circle at 35% 28%, var(--bronze-high), var(--bronze-low) 85%);
    box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 1px var(--hi);
  }

  .seq-wrap { position: relative; margin-bottom: 0; padding: 5px; }
  .seq-scroll {
    overflow-x: auto; border-radius: 6px;
    -webkit-overflow-scrolling: touch; touch-action: pan-x;
  }
  .seq-wrap::after {
    content: ""; position: absolute; top: 6px; bottom: 6px; right: 6px; width: 18px;
    background: linear-gradient(to right, transparent, var(--panel-1) 85%);
    border-radius: 0 6px 6px 0; pointer-events: none; transition: opacity .15s;
  }
  .seq-wrap.at-end::after { opacity: 0; }
  .sequencer {
    display: grid; grid-template-columns: 46px repeat(16, minmax(20px, 1fr));
    gap: 3px; min-width: 460px;
  }
  .row-label {
    position: sticky; left: 0; background: var(--panel-1); display: flex; align-items: center;
    font-size: 9px; padding-right: 3px; color: var(--text-dim); z-index: 1;
  }
  .row-label.bell { color: var(--bronze-mid); }
  .row-label.wood { color: var(--wood); }
  .row-label.drum { color: var(--red); }

  .step {
    --glow: var(--text-dim);
    height: 20px; padding: 0;
    background: radial-gradient(circle at 32% 28%, var(--panel-1), var(--panel-2) 130%);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 1px 0 var(--hi);
    transition: transform .06s ease, box-shadow .1s ease;
    touch-action: manipulation;
  }
  .step:active { transform: translateY(1px) scale(0.95); }
  .step[data-g="1"] { margin-right: 4px; }
  .step.bell { border-radius: 50% / 60%; }
  .step.wood { border-radius: 5px; }
  .step.drum { border-radius: 3px; }

  .step.active.bell {
    --glow: var(--bronze-mid);
    background: radial-gradient(circle at 32% 28%, var(--bronze-high), var(--bronze-low) 140%);
    border-color: var(--bronze-low);
    box-shadow: 0 0 5px var(--bronze-mid), 0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
  }
  .step.active.bell.high { background: radial-gradient(circle at 32% 28%, #e8c870, var(--bronze-high) 140%); }
  .step.active.bell.low  { background: radial-gradient(circle at 32% 28%, var(--bronze-mid), var(--bronze-low) 140%); }
  .step.active.wood {
    --glow: var(--wood);
    background: radial-gradient(circle at 32% 28%, #c89050, var(--wood) 140%);
    border-color: var(--wood);
    box-shadow: 0 0 5px var(--wood), 0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
  }
  .step.active.drum {
    --glow: var(--red);
    background: radial-gradient(circle at 32% 28%, #c07060, var(--red) 140%);
    border-color: var(--red);
    box-shadow: 0 0 5px var(--red), 0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
  }
  .step.playhead { box-shadow: 0 0 0 1.5px var(--text), 0 0 6px var(--glow); }

  footer { margin-top: 10px; font-size: 9px; color: var(--text-dim); line-height: 1.5; text-align: center; }
</style>
</head>
<body>

  <h1>编钟 · 木鱼 · 鼓</h1>
  <p class="tagline">TP制作🥁</p>

  <div class="unit">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <section class="panel pads-panel">
      <p class="section-label">即兴 — 点击或按键 1–8</p>
      <div class="pads" id="pads"></div>
    </section>

    <div class="panel transport">
      <button id="playBtn" aria-label="播放">▶</button>
      <div class="tempo-wrap">
        <label for="tempo">速度</label>
        <input type="range" id="tempo" min="60" max="168" value="96">
        <span id="tempoVal">96 拍/分</span>
      </div>
      <button class="ghost-btn btn3d" id="randomBtn">随机</button>
      <button class="ghost-btn btn3d" id="clearBtn">清空</button>
    </div>

    <div class="panel subrow">
      <span>图案</span>
      <div class="slots" id="slots"></div>
      <div class="feel-wrap">
        <label for="swing">摇摆</label>
        <input type="range" id="swing" min="0" max="50" value="0">
        <span id="swingVal">0%</span>
      </div>
      <button class="ghost-btn btn3d" id="humanizeBtn">人性化</button>
    </div>

    <details class="panel mixer">
      <summary>混音与音色</summary>
      <div class="mixer-grid" id="mixerGrid"></div>
    </details>

    <div class="panel seq-wrap" id="seqWrap">
      <div class="seq-scroll" id="seqScroll">
        <div class="sequencer" id="sequencer"></div>
      </div>
    </div>
  </div>

  <footer>节拍每四步分组。图案 A/B/C/D，速度与混音保存在本机。</footer>

<script>
(function () {
  "use strict";

  var NUM_STEPS = 16;
  var NUM_SLOTS = 4;
  var SLOT_NAMES = ["A", "B", "C", "D"];
  var STORE_KEY = "perc-synth-v2";

  var TRACKS = [
    { id: "bellHigh",  label: "编钟·高", shape: "bell", pitch: "high", freq: 587.33, key: "1" },
    { id: "bellMid",   label: "编钟·中", shape: "bell", pitch: "mid",  freq: 440.00, key: "2" },
    { id: "bellLow",   label: "编钟·低", shape: "bell", pitch: "low",  freq: 293.66, key: "3" },
    { id: "wood",      label: "木鱼",   shape: "wood",                         key: "4" },
    { id: "hatClosed", label: "闭镲",   shape: "drum",                         key: "5" },
    { id: "hatOpen",   label: "开镲",   shape: "drum",                         key: "6" },
    { id: "snare",     label: "军鼓",   shape: "drum",                         key: "7" },
    { id: "kick",      label: "底鼓",   shape: "drum",                         key: "8" }
  ];

  function emptySteps() {
    var o = {};
    TRACKS.forEach(function (t) { o[t.id] = new Array(NUM_STEPS).fill(false); });
    return o;
  }

  var state = {
    activeSlot: 0,
    slots: [],
    trackVol: {},
    masterVol: 0.9,
    bellDecay: 1.0,
    swing: 0,
    humanize: false
  };
  for (var s = 0; s < NUM_SLOTS; s++) state.slots.push({ tempo: 96, steps: emptySteps() });
  TRACKS.forEach(function (t) { state.trackVol[t.id] = 1.0; });

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var p = JSON.parse(raw);
      if (!p) return;
      if (Array.isArray(p.slots) && p.slots.length === NUM_SLOTS) {
        state.slots = p.slots.map(function (slot) {
          var steps = emptySteps();
          if (slot && slot.steps) {
            TRACKS.forEach(function (t) {
              if (Array.isArray(slot.steps[t.id]) && slot.steps[t.id].length === NUM_STEPS)
                steps[t.id] = slot.steps[t.id];
            });
          }
          return { tempo: (slot && slot.tempo) || 96, steps: steps };
        });
      }
      if (typeof p.masterVol === "number") state.masterVol = p.masterVol;
      if (typeof p.bellDecay === "number") state.bellDecay = p.bellDecay;
      if (typeof p.swing === "number") state.swing = p.swing;
      if (typeof p.humanize === "boolean") state.humanize = p.humanize;
      if (typeof p.activeSlot === "number") state.activeSlot = p.activeSlot;
      if (p.trackVol) {
        TRACKS.forEach(function (t) {
          if (typeof p.trackVol[t.id] === "number") state.trackVol[t.id] = p.trackVol[t.id];
        });
      }
    } catch (e) {}
  }
  loadState();

  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function activeSlot() { return state.slots[state.activeSlot]; }

  function wirePulse(el) {
    el.addEventListener("animationend", function () { el.classList.remove("pulse"); });
  }
  function triggerPulse(el) {
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
  }

  /* ---- Audio ---- */
  var audioCtx = null, noiseBuf = null, masterGain = null, trackGains = {};

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
      noiseBuf = makeNoiseBuffer();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = state.masterVol;
      masterGain.connect(audioCtx.destination);
      TRACKS.forEach(function (t) {
        var g = audioCtx.createGain();
        g.gain.value = state.trackVol[t.id];
        g.connect(masterGain);
        trackGains[t.id] = g;
      });
    }
    if (audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
    return audioCtx;
  }

  function unlockAudioOnce() {
    ensureAudio();
    if (audioCtx && audioCtx.state === "running") {
      try {
        var src = audioCtx.createBufferSource();
        src.buffer = audioCtx.createBuffer(1, 1, 22050);
        src.connect(audioCtx.destination);
        src.start(0);
      } catch (e) {}
    }
  }
  ["pointerdown", "touchstart", "keydown", "click"].forEach(function (evt) {
    document.addEventListener(evt, unlockAudioOnce, { once: true, passive: true });
  });

  function makeNoiseBuffer() {
    var len = audioCtx.sampleRate;
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function voiceBus(dest, vel) {
    var vg = audioCtx.createGain();
    vg.gain.value = vel;
    vg.connect(dest);
    return vg;
  }

  function playKick(t, dest, vel) {
    var out = voiceBus(dest, vel);
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(155, t);
    osc.frequency.exponentialRampToValueAtTime(41, t + 0.12);
    g.gain.setValueAtTime(0.95, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    osc.connect(g).connect(out);
    osc.start(t); osc.stop(t + 0.35);

    var click = audioCtx.createBufferSource();
    click.buffer = noiseBuf;
    var cf = audioCtx.createBiquadFilter();
    cf.type = "highpass"; cf.frequency.value = 1000;
    var cg = audioCtx.createGain();
    cg.gain.setValueAtTime(0.45, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.018);
    click.connect(cf).connect(cg).connect(out);
    click.start(t); click.stop(t + 0.03);
  }

  function playSnare(t, dest, vel) {
    var out = voiceBus(dest, vel);
    var noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuf;
    var bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 1800; bp.Q.value = 0.8;
    var ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.55, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    noise.connect(bp).connect(ng).connect(out);
    noise.start(t); noise.stop(t + 0.2);

    var osc = audioCtx.createOscillator();
    osc.type = "triangle"; osc.frequency.value = 190;
    var og = audioCtx.createGain();
    og.gain.setValueAtTime(0.35, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    osc.connect(og).connect(out);
    osc.start(t); osc.stop(t + 0.12);
  }

  function playMetallic(t, dest, vel, decay, level) {
    var out = voiceBus(dest, vel);
    var bus = audioCtx.createGain();
    bus.gain.value = level;
    var hp = audioCtx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 6500;
    bus.connect(hp).connect(out);

    var master = audioCtx.createGain();
    master.gain.setValueAtTime(1, t);
    master.gain.exponentialRampToValueAtTime(0.001, t + decay);
    master.connect(bus);

    [2, 3, 4.16, 5.43, 6.79, 8.21].forEach(function (r) {
      var osc = audioCtx.createOscillator();
      osc.type = "square";
      osc.frequency.value = 40 * r;
      osc.connect(master);
      osc.start(t); osc.stop(t + decay + 0.02);
    });
  }

  function playWood(t, dest, vel) {
    var out = voiceBus(dest, vel);
    var osc = audioCtx.createOscillator();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(1250, t);
    osc.frequency.exponentialRampToValueAtTime(680, t + 0.035);
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.75, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    var bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 950; bp.Q.value = 4.5;
    osc.connect(bp).connect(g).connect(out);
    osc.start(t); osc.stop(t + 0.08);

    var body = audioCtx.createOscillator();
    body.type = "sine";
    body.frequency.setValueAtTime(210, t);
    body.frequency.exponentialRampToValueAtTime(150, t + 0.045);
    var bg = audioCtx.createGain();
    bg.gain.setValueAtTime(0.55, t);
    bg.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
    body.connect(bg).connect(out);
    body.start(t); body.stop(t + 0.06);

    var click = audioCtx.createBufferSource();
    click.buffer = noiseBuf;
    var cf = audioCtx.createBiquadFilter();
    cf.type = "bandpass"; cf.frequency.value = 1600; cf.Q.value = 2.2;
    var cg = audioCtx.createGain();
    cg.gain.setValueAtTime(0.3, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.012);
    click.connect(cf).connect(cg).connect(out);
    click.start(t); click.stop(t + 0.02);
  }

  function playBell(t, dest, vel, freq) {
    var out = voiceBus(dest, vel);
    var bus = audioCtx.createGain();
    bus.gain.value = 0.85;
    var lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = Math.min(11000, freq * 9);
    bus.connect(lp).connect(out);

    var partials = [
      { r: 1.00, d: 2.0,  g: 0.50 },
      { r: 2.01, d: 1.5,  g: 0.34 },
      { r: 2.99, d: 1.1,  g: 0.24 },
      { r: 4.20, d: 0.75, g: 0.17 },
      { r: 5.36, d: 0.5,  g: 0.11 },
      { r: 6.83, d: 0.32, g: 0.07 },
      { r: 8.93, d: 0.2,  g: 0.045 }
    ];
    partials.forEach(function (p) {
      var d = p.d * state.bellDecay;
      [-0.0035, 0.0035].forEach(function (detune) {
        var osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = freq * p.r * (1 + detune);
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(p.g * 0.5, t);
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        osc.connect(g).connect(bus);
        osc.start(t); osc.stop(t + d + 0.05);
      });
    });

    var strike = audioCtx.createBufferSource();
    strike.buffer = noiseBuf;
    var sf = audioCtx.createBiquadFilter();
    sf.type = "bandpass"; sf.frequency.value = freq * 2.5; sf.Q.value = 3;
    var sg = audioCtx.createGain();
    sg.gain.setValueAtTime(0.3, t);
    sg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    strike.connect(sf).connect(sg).connect(out);
    strike.start(t); strike.stop(t + 0.03);
  }

  var PLAYERS = {
    kick: playKick,
    snare: playSnare,
    hatClosed: function (t, d, v) { playMetallic(t, d, v, 0.06, 0.5); },
    hatOpen:   function (t, d, v) { playMetallic(t, d, v, 0.32, 0.4); },
    wood: playWood
  };

  function playSound(id, t, vel) {
    if (!audioCtx || !masterGain) return;
    var dest = trackGains[id] || masterGain;
    var track = TRACKS.find(function (x) { return x.id === id; });
    if (track && track.freq) {
      playBell(t, dest, vel, track.freq);
    } else if (PLAYERS[id]) {
      PLAYERS[id](t, dest, vel);
    }
  }

  /* ---- Pads ---- */
  var padsEl = document.getElementById("pads");
  var padElsById = {};
  var keyToPad = {};

  TRACKS.forEach(function (p) {
    var btn = document.createElement("button");
    btn.className = "pad " + p.shape;
    btn.innerHTML = '<span class="kbd">' + p.key + '</span><span class="name">' + p.label + "</span>";
    wirePulse(btn);
    btn.addEventListener("click", function () {
      ensureAudio();
      playSound(p.id, audioCtx.currentTime, 1.0);
      triggerPulse(btn);
    });
    padsEl.appendChild(btn);
    padElsById[p.id] = btn;
    keyToPad[p.key] = p.id;
  });

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    var id = keyToPad[e.key];
    if (!id) return;
    ensureAudio();
    playSound(id, audioCtx.currentTime, 1.0);
    triggerPulse(padElsById[id]);
  });

  /* ---- Mixer ---- */
  var mixerGrid = document.getElementById("mixerGrid");

  function addSlider(container, cls, labelText, min, max, step, value, fmt, onInput) {
    var row = document.createElement("div");
    row.className = "mixer-row" + (cls ? " " + cls : "");
    var label = document.createElement("span");
    label.className = "m-label";
    label.textContent = labelText;
    var input = document.createElement("input");
    input.type = "range";
    input.min = min; input.max = max; input.step = step; input.value = value;
    var val = document.createElement("span");
    val.className = "m-val";
    val.textContent = fmt(value);
    input.addEventListener("input", function () {
      var v = parseFloat(input.value);
      val.textContent = fmt(v);
      onInput(v);
    });
    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(val);
    container.appendChild(row);
  }

  function pct(v) { return Math.round(v * 100) + "%"; }

  addSlider(mixerGrid, "", "主音量", 0, 1.2, 0.01, state.masterVol, pct, function (v) {
    state.masterVol = v;
    if (masterGain) masterGain.gain.value = v;
    persist();
  });

  var div1 = document.createElement("div");
  div1.className = "mixer-divider";
  mixerGrid.appendChild(div1);

  TRACKS.forEach(function (t) {
    addSlider(mixerGrid, t.shape, t.label, 0, 1.3, 0.01, state.trackVol[t.id], pct, function (v) {
      state.trackVol[t.id] = v;
      if (trackGains[t.id]) trackGains[t.id].gain.value = v;
      persist();
    });
  });

  var div2 = document.createElement("div");
  div2.className = "mixer-divider";
  mixerGrid.appendChild(div2);

  addSlider(mixerGrid, "bell", "编钟延音", 0.3, 2.5, 0.05, state.bellDecay,
    function (v) { return v.toFixed(2) + "×"; },
    function (v) { state.bellDecay = v; persist(); });

  /* ---- Slots ---- */
  var slotsEl = document.getElementById("slots");
  var slotButtons = [];
  SLOT_NAMES.forEach(function (name, idx) {
    var btn = document.createElement("button");
    btn.className = "slot-btn btn3d" + (idx === state.activeSlot ? " on" : "");
    btn.textContent = name;
    btn.addEventListener("click", function () {
      if (idx === state.activeSlot) return;
      state.activeSlot = idx;
      persist();
      renderActiveSlot();
      slotButtons.forEach(function (b, i) { b.classList.toggle("on", i === idx); });
    });
    slotsEl.appendChild(btn);
    slotButtons.push(btn);
  });

  /* ---- Swing / Humanize ---- */
  var swingInput = document.getElementById("swing");
  var swingVal = document.getElementById("swingVal");
  swingInput.value = state.swing;
  swingVal.textContent = state.swing + "%";
  swingInput.addEventListener("input", function () {
    state.swing = parseInt(swingInput.value, 10);
    swingVal.textContent = state.swing + "%";
    persist();
  });

  var humanizeBtn = document.getElementById("humanizeBtn");
  humanizeBtn.classList.toggle("on", state.humanize);
  humanizeBtn.addEventListener("click", function () {
    state.humanize = !state.humanize;
    humanizeBtn.classList.toggle("on", state.humanize);
    persist();
  });

  /* ---- Sequencer ---- */
  var seqEl = document.getElementById("sequencer");
  var seqScroll = document.getElementById("seqScroll");
  var seqWrap = document.getElementById("seqWrap");
  var stepEls = {};

  TRACKS.forEach(function (track) {
    var label = document.createElement("div");
    label.className = "row-label " + track.shape + (track.pitch ? " " + track.pitch : "");
    label.textContent = track.label;
    seqEl.appendChild(label);

    stepEls[track.id] = [];
    for (var i = 0; i < NUM_STEPS; i++) {
      var btn = document.createElement("button");
      btn.className = "step " + track.shape + (track.pitch ? " " + track.pitch : "");
      if (i % 4 === 3 && i !== NUM_STEPS - 1) btn.setAttribute("data-g", "1");
      wirePulse(btn);
      (function (trackId, idx, button) {
        button.addEventListener("click", function () {
          var slot = activeSlot();
          var val = !slot.steps[trackId][idx];
          slot.steps[trackId][idx] = val;
          button.classList.toggle("active", val);
          triggerPulse(button);
          persist();
        });
      })(track.id, i, btn);
      seqEl.appendChild(btn);
      stepEls[track.id].push(btn);
    }
  });

  var playBtn = document.getElementById("playBtn");
  var tempoInput = document.getElementById("tempo");
  var tempoVal = document.getElementById("tempoVal");

  function renderActiveSlot() {
    var slot = activeSlot();
    tempoInput.value = slot.tempo;
    tempoVal.textContent = slot.tempo + " 拍/分";
    TRACKS.forEach(function (track) {
      for (var i = 0; i < NUM_STEPS; i++)
        stepEls[track.id][i].classList.toggle("active", !!slot.steps[track.id][i]);
    });
  }

  function updateScrollFade() {
    var atEnd = seqScroll.scrollLeft + seqScroll.clientWidth >= seqScroll.scrollWidth - 2;
    seqWrap.classList.toggle("at-end", atEnd);
  }
  seqScroll.addEventListener("scroll", updateScrollFade);
  window.addEventListener("resize", updateScrollFade);

  /* ---- Transport ---- */
  var isPlaying = false;
  var currentStep = 0;
  var nextStepTime = 0;
  var lookaheadMs = 25;
  var scheduleAhead = 0.1;
  var timerId = null;
  var noteQueue = [];

  renderActiveSlot();
  requestAnimationFrame(updateScrollFade);

  tempoInput.addEventListener("input", function () {
    var v = parseInt(tempoInput.value, 10);
    activeSlot().tempo = v;
    tempoVal.textContent = v + " 拍/分";
    persist();
  });

  function secondsPerStep() { return 60 / activeSlot().tempo / 4; }

  function scheduleStep(step, baseTime) {
    var swingOffset = (step % 2 === 1) ? secondsPerStep() * (state.swing / 100) : 0;
    var jitter = state.humanize ? (Math.random() - 0.5) * 0.018 : 0;
    var time = baseTime + swingOffset + jitter;
    noteQueue.push({ step: step, time: time });
    var slot = activeSlot();
    TRACKS.forEach(function (track) {
      if (slot.steps[track.id][step]) {
        var vel = state.humanize ? 0.85 + Math.random() * 0.3 : 1.0;
        playSound(track.id, time, vel);
      }
    });
  }

  function advanceStep() {
    nextStepTime += secondsPerStep();
    currentStep = (currentStep + 1) % NUM_STEPS;
  }

  function scheduler() {
    while (nextStepTime < audioCtx.currentTime + scheduleAhead) {
      scheduleStep(currentStep, nextStepTime);
      advanceStep();
    }
    timerId = setTimeout(scheduler, lookaheadMs);
  }

  function clearPlayhead() {
    TRACKS.forEach(function (track) {
      stepEls[track.id].forEach(function (el) { el.classList.remove("playhead"); });
    });
  }

  function drawLoop() {
    if (audioCtx && isPlaying) {
      var now = audioCtx.currentTime;
      var latest = null;
      while (noteQueue.length && noteQueue[0].time <= now)
        latest = noteQueue.shift().step;
      if (latest !== null) {
        clearPlayhead();
        TRACKS.forEach(function (track) { stepEls[track.id][latest].classList.add("playhead"); });
      }
    }
    requestAnimationFrame(drawLoop);
  }
  requestAnimationFrame(drawLoop);

  function startSeq() {
    ensureAudio();
    if (isPlaying || !audioCtx) return;
    isPlaying = true;
    currentStep = 0;
    noteQueue = [];
    nextStepTime = audioCtx.currentTime + 0.05;
    scheduler();
    playBtn.textContent = "⏸";
    playBtn.setAttribute("aria-label", "暂停");
  }

  function stopSeq() {
    isPlaying = false;
    clearTimeout(timerId);
    clearPlayhead();
    playBtn.textContent = "▶";
    playBtn.setAttribute("aria-label", "播放");
  }

  wirePulse(playBtn);
  playBtn.addEventListener("click", function () {
    triggerPulse(playBtn);
    if (isPlaying) stopSeq(); else startSeq();
  });

  document.getElementById("clearBtn").addEventListener("click", function () {
    var slot = activeSlot();
    TRACKS.forEach(function (track) {
      slot.steps[track.id] = new Array(NUM_STEPS).fill(false);
      stepEls[track.id].forEach(function (el) { el.classList.remove("active"); });
    });
    persist();
  });

  document.getElementById("randomBtn").addEventListener("click", function () {
    var density = {
      kick: 0.28, snare: 0.22, hatClosed: 0.45, hatOpen: 0.12,
      wood: 0.18, bellHigh: 0.14, bellMid: 0.14, bellLow: 0.1
    };
    var slot = activeSlot();
    TRACKS.forEach(function (track) {
      var p = density[track.id] || 0.2;
      for (var i = 0; i < NUM_STEPS; i++) {
        var val = Math.random() < p;
        slot.steps[track.id][i] = val;
        stepEls[track.id][i].classList.toggle("active", val);
      }
    });
    persist();
  });
})();
</script>
</body>
</html>
