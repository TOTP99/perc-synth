<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>钟鼓楼 · 国风打击乐</title>
<style>
  :root {
    /* 禅夜钟鼓楼：墨夜为底 · 紫檀为龛 · 鎏金为饰 · 朱砂点睛 */
    --page-bg: #0f0c09;
    --case-1: #4a2c1a;
    --case-2: #33200f;
    --case-3: #1c1109;
    --panel-1: #251812;
    --panel-2: #180f08;
    --text: #ecdfc0;
    --text-dim: #a5906a;
    --border: rgba(201,163,92,0.28);
    --recess: rgba(0,0,0,0.55);
    --unit-shadow: rgba(0,0,0,0.65);
    --hi: rgba(232,207,143,0.10);
    --patina: #5a7a4a;
    --patina-deep: #3a5a38;
    --bronze-high: #e3bd6b;
    --bronze-mid: #b08a3e;
    --bronze-low: #7a5c26;
    --gold-text-1: #f2dda6;
    --gold-text-2: #b08a3e;
    --wood: #8a5a32;
    --red: #a63c2a;
    --red-deep: #6e2418;
    --accent: #8a9a58;
    --focus: #a8b870;
  }

  * {
    box-sizing: border-box; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none; -moz-user-select: none; user-select: none;
  }
  html, body { margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 420px 200px at 50% -4%, rgba(227,189,107,0.13), transparent 60%),
      radial-gradient(ellipse 520px 340px at 50% 108%, rgba(120,50,30,0.10), transparent 55%),
      radial-gradient(ellipse 700px 500px at 50% 40%, rgba(40,26,16,0.35), transparent 70%),
      var(--page-bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: 10px 6px 18px; max-width: 600px; margin: 0 auto; min-height: 100%;
    transition: padding .35s ease, max-width .35s ease;
  }
  .towers { display: block; width: 190px; height: auto; margin: 2px auto 0; opacity: 0.9; }
  h1 {
    font-family: "Songti SC", "STSong", "Noto Serif SC", "SimSun", Georgia, serif;
    font-weight: 700; font-size: 30px; letter-spacing: 0.32em; text-indent: 0.32em;
    margin: 2px 0 2px; text-align: center;
    background: linear-gradient(180deg, var(--gold-text-1) 20%, var(--gold-text-2) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 8px rgba(176,138,62,0.28));
    transition: font-size .3s ease, margin .3s ease;
  }
  .tagline {
    color: var(--text-dim); font-size: 10px; margin: 0 0 6px; text-align: center;
    letter-spacing: 0.42em; text-indent: 0.42em;
    transition: font-size .3s ease, margin .3s ease, opacity .3s ease;
  }
  /* 回纹分隔：双线 + 菱形 */
  .fret { display: flex; align-items: center; gap: 8px; margin: 0 26px 10px; }
  .fret::before, .fret::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--bronze-mid), transparent);
    opacity: 0.7;
  }
  .fret i {
    width: 7px; height: 7px; transform: rotate(45deg); flex-shrink: 0;
    border: 1px solid var(--bronze-mid); opacity: 0.85;
  }
  button {
    font-family: inherit; border: none; cursor: pointer; color: var(--text); background: none;
    touch-action: manipulation;
  }
  button:focus-visible, .step:focus-visible, input:focus-visible {
    outline: 1.5px solid var(--focus); outline-offset: 1px;
  }

  /* 模式切换 */
  .mode-switch {
    display: flex; gap: 10px; justify-content: center; margin: 0 0 16px;
  }
  /* 幡签形：方头 + 底部尖尾 */
  .mode-btn {
    position: relative; flex: 0 1 150px; padding: 8px 0 10px; font-size: 13px;
    letter-spacing: 0.34em; text-indent: 0.34em;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    border-radius: 6px 6px 0 0;
    background: linear-gradient(160deg, var(--case-1), var(--case-2));
    border: 1px solid var(--border); border-bottom: none; color: var(--text-dim);
    box-shadow: 0 2px 0 var(--case-3), 0 3px 6px rgba(0,0,0,.35), inset 0 1px 0 var(--hi);
    transition: transform .07s ease, box-shadow .07s ease, color .15s;
  }
  .mode-btn::after {
    content: ""; position: absolute; left: -1px; right: -1px; bottom: -9px; height: 9px;
    background: inherit; border-left: 1px solid var(--border); border-right: 1px solid var(--border);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .mode-btn.on {
    background: linear-gradient(160deg, var(--bronze-high), var(--bronze-low));
    color: #2a1c08;
    box-shadow: 0 0 0 var(--case-3), inset 0 2px 3px rgba(0,0,0,.3), 0 0 14px rgba(227,189,107,0.25);
    transform: translateY(1px);
  }
  .mode-btn.on::after { border-left-color: var(--bronze-low); border-right-color: var(--bronze-low); }

  .unit {
    position: relative;
    background:
      repeating-linear-gradient(93deg, rgba(0,0,0,0.06) 0 2px, transparent 2px 7px),
      linear-gradient(145deg, rgba(227,189,107,0.10) 0%, transparent 38%),
      linear-gradient(160deg, var(--case-1) 0%, var(--case-2) 48%, var(--case-3) 100%);
    border-radius: 14px; padding: 14px 10px 12px;
    box-shadow:
      0 14px 28px -8px var(--unit-shadow),
      inset 0 1px 0 var(--hi),
      inset 0 0 0 1px rgba(227,189,107,0.16),
      inset 0 -1px 0 rgba(0,0,0,0.4);
    border: 1px solid rgba(150,110,60,0.4);
    transform: scale(1);
    transition: padding .35s ease, border-radius .35s ease, box-shadow .35s ease, opacity .28s ease, transform .28s ease;
  }
  body.is-rotating .unit { opacity: 0.72; transform: scale(0.985); }

  .screw {
    position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--bronze-high), var(--patina-deep) 85%);
    box-shadow: 0 1px 1px rgba(0,0,0,.5), inset 0 0 1px var(--hi);
  }
  .screw::after {
    content: ""; position: absolute; top: 48%; left: 15%; right: 15%; height: 1px;
    background: rgba(0,0,0,.5); transform: rotate(24deg);
  }
  .screw.tl { top: 6px; left: 6px; } .screw.tr { top: 6px; right: 6px; }
  .screw.bl { bottom: 6px; left: 6px; } .screw.br { bottom: 6px; right: 6px; }

  .panel {
    background:
      linear-gradient(180deg, rgba(227,189,107,0.06), transparent 32%),
      linear-gradient(180deg, var(--panel-1), var(--panel-2));
    border: 1px solid var(--border); border-radius: 10px;
    border-top: 2px solid rgba(176,138,62,0.55);
    box-shadow: inset 0 1px 4px var(--recess), 0 2px 8px rgba(0,0,0,0.3);
    padding: 10px; margin-bottom: 8px;
    transition: padding .3s ease, margin .3s ease;
  }
  /* 签题：两侧金线 */
  .section-label {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--bronze-high); margin: 0 0 8px;
    letter-spacing: 0.3em; text-indent: 0.1em; white-space: nowrap;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
  }
  .section-label::before, .section-label::after {
    content: ""; flex: 1; height: 1px; min-width: 12px;
    background: linear-gradient(90deg, transparent, rgba(176,138,62,0.6));
  }
  .section-label::after {
    background: linear-gradient(90deg, rgba(176,138,62,0.6), transparent);
  }

  .btn3d {
    background: linear-gradient(160deg, #3a2413, #2a1a0d);
    border: 1px solid var(--border); border-radius: 6px;
    box-shadow: 0 2px 0 #120b06, 0 2px 5px rgba(0,0,0,.4), inset 0 1px 0 var(--hi);
    transition: transform .07s ease, box-shadow .07s ease, color .15s, border-color .15s;
    color: var(--text);
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif; letter-spacing: 0.12em;
  }
  .btn3d:active {
    transform: translateY(2px);
    box-shadow: 0 0 0 #120b06, inset 0 2px 3px rgba(0,0,0,.4);
  }
  .btn3d.on {
    background: linear-gradient(160deg, var(--bronze-high), var(--bronze-low));
    color: #2a1c08; border-color: var(--bronze-low);
    box-shadow: 0 0 0 #120b06, inset 0 2px 3px rgba(0,0,0,.3), 0 0 10px rgba(227,189,107,0.3);
    transform: translateY(1px);
  }

  /* ---------- 木鱼模式 ---------- */
  #view-muyu { text-align: center; }
  /* 功德簿 */
  .merit-board {
    display: flex; justify-content: center; gap: 10px; margin: 2px 0 10px;
  }
  .merit-item {
    min-width: 84px; padding: 8px 6px 6px;
    background: linear-gradient(180deg, rgba(227,189,107,0.08), rgba(0,0,0,0.25));
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: inset 0 1px 0 var(--hi);
  }
  .merit-num {
    font-size: 26px; font-weight: 700; line-height: 1.2;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, var(--gold-text-1), var(--gold-text-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .merit-cap { font-size: 9px; color: var(--text-dim); letter-spacing: 0.28em; text-indent: 0.28em; margin-top: 2px; }
  .muyu-stage { position: relative; display: inline-block; margin: 6px 0 0; }
  /* 莲花座 */
  .lotus { position: absolute; left: 50%; bottom: -14px; width: 190px; transform: translateX(-50%); z-index: 0; opacity: 0.95; pointer-events: none; }
  .lotus svg { display: block; width: 100%; height: auto; }
  .muyu-fish { position: relative; z-index: 1; }
  .muyu-fish {
    width: 210px; height: 210px; border-radius: 50%;
    padding: 0; border: 3px solid rgba(201,168,74,0.55);
    background: #151210;
    box-shadow: 0 8px 18px rgba(0,0,0,.5), 0 0 0 6px rgba(201,168,74,0.08);
    position: relative; overflow: hidden;
    touch-action: manipulation; cursor: pointer;
  }
  .muyu-fish img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; pointer-events: none; display: block; }
  .muyu-fish.noimg {
    background: radial-gradient(circle at 34% 28%, #d89a58, var(--wood) 55%, #4a2e16 100%);
  }
  .muyu-fish.thump { animation: fishThump 0.3s ease; }
  @keyframes fishThump {
    0% { transform: scale(1); }
    30% { transform: scale(0.93); }
    60% { transform: scale(1.015); }
    100% { transform: scale(1); }
  }
  /* 木槌：柄在右上，槌头悬于鱼身左上，敲击时落下 */
  .mallet-wrap {
    position: absolute; right: -46px; top: -52px;
    width: 170px; height: 170px; z-index: 6; pointer-events: none;
  }
  .mallet { position: relative; width: 170px; height: 170px; transform-origin: 164px 28px; transform: rotate(24deg); }
  .mallet.hit { animation: malletHit 0.32s ease; }
  @keyframes malletHit {
    0% { transform: rotate(24deg); }
    35% { transform: rotate(-8deg); }
    70% { transform: rotate(14deg); }
    100% { transform: rotate(24deg); }
  }
  .mallet-handle {
    position: absolute; left: 40px; top: 22px; width: 124px; height: 12px;
    transform: rotate(45deg); transform-origin: 100% 50%;
    background: linear-gradient(180deg, #a87138, #6e421e);
    border-radius: 6px;
    box-shadow: inset 0 1px 2px rgba(255,220,160,.4), 0 2px 4px rgba(0,0,0,.5);
  }
  .mallet-head {
    position: absolute; left: 24px; top: 98px; width: 40px; height: 40px; border-radius: 50%;
    background:
      repeating-linear-gradient(45deg, rgba(120,100,80,.14) 0 3px, transparent 3px 6px),
      radial-gradient(circle at 35% 30%, #f7f1e5, #d9cfbc 55%, #ab9d84);
    border: 1px solid rgba(90,70,50,.45);
    box-shadow: 0 3px 6px rgba(0,0,0,.5), inset 0 -3px 6px rgba(120,100,80,.35);
  }
  /* 敲击冲击波纹 */
  .shock {
    position: absolute; left: 50%; top: 50%; width: 100%; aspect-ratio: 1/1;
    border-radius: 50%; border: 3px solid rgba(216,200,140,0.75);
    transform: translate(-50%,-50%) scale(0.55); opacity: 0; pointer-events: none; z-index: 5;
    animation: shockWave 0.5s ease-out;
  }
  @keyframes shockWave {
    0% { opacity: 0.85; transform: translate(-50%,-50%) scale(0.55); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
  }
  .float-plus {
    position: absolute; left: 50%; top: 18%;
    font-size: 22px; font-weight: 700; color: var(--bronze-high);
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
    pointer-events: none; z-index: 5;
    animation: floatUp 0.8s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.7); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -46px) scale(1.1); }
  }
  .combo-line { min-height: 16px; font-size: 11px; color: var(--accent); letter-spacing: 0.15em; margin: 2px 0 6px; }
  .muyu-actions { display: flex; gap: 8px; justify-content: center; margin-top: 4px; flex-wrap: wrap; }
  .muyu-actions .ghost-btn { padding: 7px 14px; font-size: 11px; letter-spacing: 0.1em; }

  /* ---------- 鼓垫（图片 + CSS 回退）：深漆描金 ---------- */
  .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pad {
    --glow: var(--bronze-mid);
    position: relative; aspect-ratio: 1; border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    padding: 0; overflow: hidden;
    background:
      radial-gradient(circle at 32% 26%, rgba(227,189,107,0.14), transparent 55%),
      linear-gradient(165deg, #2b1c10, #170e07);
    border: 1px solid rgba(201,163,92,0.4);
    box-shadow: 0 3px 8px rgba(0,0,0,.45), inset 0 1px 0 var(--hi), inset 0 0 0 1px rgba(0,0,0,0.35);
    box-shadow: 0 2px 0 rgba(40,30,15,0.55), 0 3px 8px rgba(0,0,0,.4), inset 0 1px 0 var(--hi);
    transition: transform .07s ease, box-shadow .07s ease; touch-action: manipulation;
  }
  .pad img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; border-radius: inherit; pointer-events: none;
  }
  .pad .num {
    font-size: 19px; font-weight: 700; color: var(--bronze-high);
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .pad .name { font-size: 9px; color: var(--text-dim); letter-spacing: 0.08em; }
  .pad:active { transform: translateY(1px) scale(0.97); }
  .pad.bell { --glow: var(--bronze-mid); }
  .pad.bell .num { color: var(--bronze-high); }
  .pad.wood { --glow: var(--wood); }
  .pad.wood .num { color: #c89050; }
  .pad.drum { --glow: var(--red); }
  .pad.drum .num { color: #c07060; }

  @keyframes ringPulse {
    0%   { box-shadow: 0 0 0 0 var(--glow), 0 2px 0 rgba(0,0,0,.2); }
    100% { box-shadow: 0 0 0 8px transparent, 0 2px 0 rgba(0,0,0,0); }
  }
  .pulse { animation: ringPulse .35s ease-out; }

  .transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* 堂鼓钮：朱砂鼓面 + 鎏金鼓箍 */
  #playBtn {
    width: 40px; height: 40px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #c8553c, var(--red) 55%, var(--red-deep) 130%);
    border: 2px solid var(--bronze-mid);
    color: var(--gold-text-1); font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 3px 0 #120b06, 0 4px 8px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,220,160,0.25);
    transition: transform .07s ease, box-shadow .07s ease;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  #playBtn:active { transform: translateY(2px); box-shadow: 0 0 0 #120b06, inset 0 2px 4px rgba(0,0,0,.4); }
  #playBtn .pause-bars { display: flex; gap: 3px; align-items: center; }
  #playBtn .pause-bars i { display: block; width: 3px; height: 11px; border-radius: 1px; background: var(--gold-text-1); }
  #recBtn.on { color: #e8e0c8; border-color: #a03828; }
  #recBtn .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #5a5a5a; margin-right: 4px; vertical-align: 1px;
  }
  #recBtn.on .dot { background: #e04030; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .tempo-wrap { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 110px; }
  .tempo-wrap label { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .tempo-wrap input[type="range"] { flex: 1; }
  #tempoVal { font-size: 10px; font-variant-numeric: tabular-nums; width: 48px; text-align: right; color: var(--text-dim); }
  .ghost-btn { padding: 5px 8px; font-size: 10px; }

  .subrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 10px; color: var(--text-dim); }
  .slots { display: flex; gap: 3px; }
  .slot-btn { width: 22px; height: 22px; border-radius: 5px; font-size: 10px; font-weight: 700; }
  .sub-gap { width: 8px; flex-shrink: 0; }
  .feel-wrap { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 90px; margin-left: 4px; }
  .feel-wrap input[type="range"] { flex: 1; }

  /* 预置锣鼓点 */
  .preset-scroll {
    display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 4px;
    -webkit-overflow-scrolling: touch;
  }
  /* 竹签：签筒抽签意境 */
  .preset-chip {
    position: relative; flex-shrink: 0; padding: 8px 14px 8px 16px; font-size: 12px; letter-spacing: 0.1em;
    border-radius: 4px 10px 10px 4px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    background: linear-gradient(180deg, #efe3c2, #d9c69a);
    border: 1px solid #b89a5e; color: #4a2f14;
    box-shadow: 0 2px 0 #8a6c3c, 0 3px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .preset-chip::before {
    content: ""; position: absolute; left: 5px; top: 50%; width: 4px; height: 4px;
    border-radius: 50%; transform: translateY(-50%);
    background: #8a6c3c; box-shadow: inset 0 1px 1px rgba(0,0,0,0.4);
  }
  .preset-chip:active { transform: translateY(1px); box-shadow: 0 0 0 #8a6c3c; }
  .preset-chip small { display: block; font-size: 8px; color: #8a6c3c; letter-spacing: 0; font-family: inherit; }

  details.mixer summary {
    cursor: pointer; font-size: 10px; color: var(--text-dim); list-style: none;
    display: flex; align-items: center; gap: 4px; margin: -2px -2px 0;
  }
  details.mixer summary::-webkit-details-marker { display: none; }
  details.mixer summary::before { content: "▸"; font-size: 8px; }
  details.mixer[open] summary::before { content: "▾"; }
  .mixer-grid { margin-top: 6px; display: flex; flex-direction: column; gap: 5px; }
  .mixer-row { display: grid; grid-template-columns: 52px 1fr 28px; align-items: center; gap: 5px; }
  .mixer-row .m-label { font-size: 10px; color: var(--text-dim); }
  .mixer-row.bell .m-label { color: var(--bronze-mid); }
  .mixer-row.wood .m-label { color: var(--wood); }
  .mixer-row.drum .m-label { color: var(--red); }
  .mixer-row .m-val { font-size: 9px; color: var(--text-dim); text-align: right; font-variant-numeric: tabular-nums; }
  .mixer-divider { height: 1px; background: var(--border); margin: 1px 0; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 3px; border-radius: 2px; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(180deg, var(--case-3), var(--case-2));
    box-shadow: inset 0 1px 2px var(--recess);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px; border-radius: 50%; margin-top: -4.5px;
    background: radial-gradient(circle at 35% 28%, var(--bronze-high), var(--bronze-low) 85%);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 1px var(--hi);
  }
  input[type="range"]::-moz-range-track {
    height: 3px; border-radius: 2px;
    background: linear-gradient(180deg, var(--case-3), var(--case-2));
    box-shadow: inset 0 1px 2px var(--recess);
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border);
    background: radial-gradient(circle at 35% 28%, var(--bronze-high), var(--bronze-low) 85%);
    box-shadow: 0 1px 2px rgba(0,0,0,.45), inset 0 0 1px var(--hi);
  }

  .seq-wrap { position: relative; margin-bottom: 0; padding: 5px; }
  .seq-scroll { overflow-x: auto; border-radius: 6px; -webkit-overflow-scrolling: touch; touch-action: pan-x; }
  .seq-wrap::after {
    content: ""; position: absolute; top: 6px; bottom: 6px; right: 6px; width: 18px;
    background: linear-gradient(to right, transparent, var(--panel-1) 85%);
    border-radius: 0 6px 6px 0; pointer-events: none; transition: opacity .15s;
  }
  .seq-wrap.at-end::after { opacity: 0; }
  .sequencer {
    display: grid; grid-template-columns: 46px repeat(16, minmax(20px, 1fr));
    gap: 3px; min-width: 460px;
  }
  .row-label {
    position: sticky; left: 0; background: var(--panel-1);
    display: flex; align-items: center; font-size: 9px; padding-right: 3px; color: var(--text-dim); z-index: 1;
  }
  .row-label.bell { color: var(--bronze-mid); }
  .row-label.wood { color: var(--wood); }
  .row-label.drum { color: var(--red); }

  .step {
    --glow: var(--text-dim); height: 20px; padding: 0;
    background: radial-gradient(circle at 32% 28%, var(--panel-1), var(--panel-2) 130%);
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 1px 0 var(--hi);
    transition: transform .06s ease, box-shadow .1s ease; touch-action: manipulation;
  }
  .step:active { transform: translateY(1px) scale(0.95); }
  .step[data-g="1"] { margin-right: 4px; }
  .step.bell { border-radius: 50% / 60%; }
  .step.wood { border-radius: 5px; }
  .step.drum { border-radius: 3px; }
  .step.active.bell {
    --glow: var(--bronze-mid);
    background: radial-gradient(circle at 32% 28%, var(--gold-text-1), var(--bronze-low) 140%);
    border-color: var(--bronze-low);
    box-shadow: 0 0 6px var(--bronze-mid), 0 1px 2px rgba(0,0,0,.3), inset 0 1px 0 var(--hi);
  }
  .step.active.bell.high { background: radial-gradient(circle at 32% 28%, #f6e2a0, var(--bronze-high) 140%); }
  .step.active.bell.low  { background: radial-gradient(circle at 32% 28%, var(--bronze-mid), var(--bronze-low) 140%); }
  .step.active.wood {
    --glow: var(--wood);
    background: radial-gradient(circle at 32% 28%, #d8a05c, var(--wood) 140%);
    border-color: var(--wood);
    box-shadow: 0 0 6px var(--wood), 0 1px 2px rgba(0,0,0,.3), inset 0 0 1px var(--hi);
  }
  .step.active.drum {
    --glow: var(--red);
    background: radial-gradient(circle at 32% 28%, #d0705a, var(--red) 140%);
    border-color: var(--red-deep);
    box-shadow: 0 0 6px var(--red), 0 1px 2px rgba(0,0,0,.3), inset 0 0 1px var(--hi);
  }
  .step.playhead { box-shadow: 0 0 0 1.5px var(--gold-text-1), 0 0 6px var(--glow); }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(8px);
    background: rgba(24,15,8,0.94); color: var(--text);
    border: 1px solid rgba(201,163,92,0.5); border-radius: 8px;
    font-size: 11px; padding: 8px 14px; letter-spacing: 0.06em;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
    z-index: 9999; max-width: 86vw; text-align: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  footer {
    margin-top: 12px; font-size: 9px; color: var(--text-dim); line-height: 1.7; text-align: center;
    letter-spacing: 0.24em; text-indent: 0.24em;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    transition: margin .3s ease, font-size .3s ease, opacity .3s ease;
  }
  footer .foot-sub { display: block; letter-spacing: 0.1em; text-indent: 0.1em; opacity: 0.7; font-size: 8px; }

  @media (orientation: landscape) {
    body { padding: 6px 10px 10px; max-width: 920px; }
    .towers { width: 130px; }
    h1 { font-size: 18px; margin: 0; }
    .tagline { font-size: 9px; margin: 0 0 4px; letter-spacing: 0.3em; text-indent: 0.3em; }
    .fret { margin: 0 60px 8px; }
    .mode-switch { margin: 0 0 12px; }
    .mode-btn { padding: 5px 0 7px; font-size: 12px; flex-basis: 120px; }
    .unit { padding: 8px 10px 8px; border-radius: 12px; }
    .panel { padding: 6px 8px; margin-bottom: 5px; }
    .pads { gap: 4px; grid-template-columns: repeat(8, 1fr); }
    .pad { aspect-ratio: 1; border-radius: 6px; }
    .pad .num { font-size: 15px; }
    .pad .name { font-size: 8px; }
    #playBtn { width: 28px; height: 28px; font-size: 11px; }
    .ghost-btn { padding: 4px 7px; font-size: 9px; }
    .slot-btn { width: 20px; height: 20px; font-size: 9px; }
    .subrow { gap: 5px; font-size: 9px; }
    .step { height: 18px; }
    .sequencer { grid-template-columns: 42px repeat(16, minmax(18px, 1fr)); gap: 3px; min-width: 420px; }
    .row-label { font-size: 8px; }
    /* 木鱼横屏：左右并列 */
    #view-muyu .muyu-cols { display: flex; align-items: center; gap: 12px; }
    #view-muyu .muyu-left { flex: 1; }
    #view-muyu .muyu-right { flex: 1; }
    .muyu-fish { width: 170px; height: 170px; }
    .mallet-wrap { transform: scale(0.8); right: -36px; top: -42px; }
    footer { margin-top: 6px; font-size: 8px; opacity: 0.85; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    body { padding: 4px 8px 6px; }
    .towers { display: none; }
    h1 { font-size: 14px; }
    .tagline { display: none; }
    .fret { display: none; }
    .mode-switch { margin: 0 0 10px; }
    .mode-btn { padding: 4px 0 6px; font-size: 11px; flex-basis: 104px; }
    .unit { padding: 6px 8px; }
    .panel { padding: 5px 6px; margin-bottom: 4px; }
    .pad { aspect-ratio: 1; }
    .step { height: 16px; }
    .muyu-fish { width: 140px; height: 140px; }
    .mallet-wrap { transform: scale(0.66); right: -30px; top: -34px; }
    footer { display: none; }
  }
  @media (orientation: portrait) and (max-width: 400px) {
    body { padding: 8px 4px 14px; }
    .unit { padding: 10px 6px 8px; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });

  var NUM_STEPS = 16;
  var NUM_SLOTS = 4;
  var SLOT_NAMES = ["A", "B", "C", "D"];
  var STORE_KEY = "zhonggulou-v1";
  var LEGACY_KEY = "perc-synth-v2";

  var TRACKS = [
    { id: "bellHigh",  label: "编钟·高", shape: "bell", pitch: "high", freq: 587.33, key: "1" },
    { id: "bellMid",   label: "编钟·中", shape: "bell", pitch: "mid",  freq: 440.00, key: "2" },
    { id: "bellLow",   label: "编钟·低", shape: "bell", pitch: "low",  freq: 293.66, key: "3" },
    { id: "wood",      label: "木鱼",   shape: "wood",                         key: "4" },
    { id: "bo",    label: "钹",   shape: "drum", key: "5" },
    { id: "daluo", label: "大锣", shape: "drum", key: "6" },
    { id: "snare",     label: "军鼓",   shape: "drum",                         key: "7" },
    { id: "kick",      label: "底鼓",   shape: "drum",                         key: "8" }
  ];

  var TRACK_BY_ID = {};
  TRACKS.forEach(function (t) { TRACK_BY_ID[t.id] = t; });

  /* 预置锣鼓点：风格化编配（非权威锣鼓经记谱），点一下载入当前图案槽 */
  var PRESETS = [
    { name: "迎宾锣鼓", tempo: 120, desc: "大锣开道",
      steps: { kick: [0,4,8,12], snare: [4,12], bo: [6,14], daluo: [0],
               wood: [2,6,10,14], bellLow: [0], bellMid: [8] } },
    { name: "急急风", tempo: 150, desc: "密锣紧打",
      steps: { kick: [0,4,8,12], snare: [2,6,10,14], bo: [0,4,8,12], daluo: [0],
               wood: [1,3,5,7,9,11,13,15], bellHigh: [0,8], bellLow: [12] } },
    { name: "慢长锤", tempo: 72, desc: "一锤定音",
      steps: { kick: [0,8], bellLow: [0,8], bellMid: [4,12],
               wood: [0,4,8,12], daluo: [15] } },
    { name: "夜深沉", tempo: 66, desc: "钟磬悠远",
      steps: { bellHigh: [0,6,10], bellMid: [2,8,14], bellLow: [4,12],
               wood: [8], bo: [12] } },
    { name: "龙腾虎跃", tempo: 132, desc: "欢腾热烈",
      steps: { kick: [0,4,8,12,14], snare: [4,12], bo: [2,6,10,14], daluo: [0,8],
               wood: [2,6,10,14], bellMid: [0,8], bellHigh: [10] } }
  ];

  function emptySteps() {
    var o = {};
    TRACKS.forEach(function (t) { o[t.id] = new Array(NUM_STEPS).fill(false); });
    return o;
  }

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  var state = {
    view: "muyu",
    activeSlot: 0,
    slots: [],
    trackVol: {},
    masterVol: 0.9,
    bellDecay: 1.0,
    swing: 0,
    humanize: false,
    merit: { total: 0, day: "", dayCount: 0, maxCombo: 0 }
  };
  for (var s = 0; s < NUM_SLOTS; s++) state.slots.push({ tempo: 96, steps: emptySteps() });
  TRACKS.forEach(function (t) { state.trackVol[t.id] = 1.0; });

  function applyLoadedSlots(p) {
    if (Array.isArray(p.slots) && p.slots.length === NUM_SLOTS) {
      state.slots = p.slots.map(function (slot) {
        var steps = emptySteps();
        if (slot && slot.steps) {
          TRACKS.forEach(function (t) {
            if (Array.isArray(slot.steps[t.id]) && slot.steps[t.id].length === NUM_STEPS)
              steps[t.id] = slot.steps[t.id];
          });
        }
        return { tempo: (slot && slot.tempo) || 96, steps: steps };
      });
    }
    if (typeof p.masterVol === "number") state.masterVol = Math.max(0.15, p.masterVol);
    if (typeof p.bellDecay === "number") state.bellDecay = p.bellDecay;
    if (typeof p.swing === "number") state.swing = p.swing;
    if (typeof p.humanize === "boolean") state.humanize = p.humanize;
    if (typeof p.activeSlot === "number") state.activeSlot = p.activeSlot;
    if (p.trackVol) {
      TRACKS.forEach(function (t) {
        if (typeof p.trackVol[t.id] === "number")
          state.trackVol[t.id] = Math.max(0.1, p.trackVol[t.id]);
      });
    }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p) {
          applyLoadedSlots(p);
          if (p.merit && typeof p.merit.total === "number") {
            state.merit.total = p.merit.total;
            state.merit.day = p.merit.day || "";
            state.merit.dayCount = p.merit.dayCount || 0;
            state.merit.maxCombo = p.merit.maxCombo || 0;
          }
          if (p.view === "muyu" || p.view === "seq") state.view = p.view;
          return;
        }
      }
      /* 老版本迁移：perc-synth-v2 → zhonggulou-v1 */
      var legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) {
        var lp = JSON.parse(legacy);
        if (lp) applyLoadedSlots(lp);
      }
    } catch (e) {}
  }
  loadState();

  function isSlotEmpty(slot) {
    return TRACKS.every(function (t) {
      return slot.steps[t.id].every(function (v) { return !v; });
    });
  }

  function seedDefaultPattern() {
    var steps = emptySteps();
    [0, 4, 8, 12].forEach(function (i) { steps.kick[i] = true; });
    [4, 12].forEach(function (i) { steps.snare[i] = true; });
    [2, 6, 10, 14].forEach(function (i) { steps.wood[i] = true; });
    steps.bellLow[0] = true;
    steps.bellMid[8] = true;
    steps.bo[8] = true;
    steps.daluo[0] = true;
    state.slots[0] = { tempo: 96, steps: steps };
  }
  if (isSlotEmpty(state.slots[0])) seedDefaultPattern();

  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function activeSlot() { return state.slots[state.activeSlot]; }

  var toastEl = document.getElementById("toast");
  var toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  function wirePulse(el) {
    el.addEventListener("animationend", function () { el.classList.remove("pulse"); });
  }
  function triggerPulse(el) {
    if (!el) return;
    el.classList.remove("pulse");
    void el.offsetWidth;
    el.classList.add("pulse");
  }

  /* Audio */
  var audioCtx = null, noiseBuf = null, masterGain = null, trackGains = {};
  var recDest = null;

  function makeNoiseBuffer() {
    var len = audioCtx.sampleRate;
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function initAudioGraph() {
    if (audioCtx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    noiseBuf = makeNoiseBuffer();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = state.masterVol > 0 ? state.masterVol : 0.9;
    /* 总线限幅：多轨叠加（钟/镲/鼓）时防止爆音 */
    var limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -8;
    limiter.knee.value = 10;
    limiter.ratio.value = 6;
    limiter.attack.value = 0.002;
    limiter.release.value = 0.12;
    masterGain.connect(limiter);
    limiter.connect(audioCtx.destination);
    /* 录音分流：从限幅后取信号，不影响监听 */
    try {
      recDest = audioCtx.createMediaStreamDestination();
      limiter.connect(recDest);
    } catch (e) { recDest = null; }
    TRACKS.forEach(function (t) {
      var g = audioCtx.createGain();
      var vol = state.trackVol[t.id];
      g.gain.value = (typeof vol === "number" && vol > 0) ? vol : 1.0;
      g.connect(masterGain);
      trackGains[t.id] = g;
    });
  }

  function ensureAudio() {
    initAudioGraph();
    if (!audioCtx) return null;
    if (audioCtx.state === "suspended") {
      try { audioCtx.resume(); } catch (e) {}
    }
    try {
      var src = audioCtx.createBufferSource();
      src.buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate || 44100);
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (e) {}
    return audioCtx;
  }

  ["pointerdown", "touchstart", "touchend", "keydown", "click"].forEach(function (evt) {
    document.addEventListener(evt, function () { ensureAudio(); }, { passive: true });
  });

  function voiceBus(dest, vel) {
    var vg = audioCtx.createGain();
    vg.gain.value = vel;
    vg.connect(dest);
    return vg;
  }

  function playKick(t, dest, vel) {
    var out = voiceBus(dest, vel);
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(185, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.14);
    g.gain.setValueAtTime(1.0, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
    osc.connect(g); g.connect(out);
    osc.start(t); osc.stop(t + 0.38);

    var click = audioCtx.createBufferSource();
    click.buffer = noiseBuf;
    var cf = audioCtx.createBiquadFilter();
    cf.type = "bandpass"; cf.frequency.value = 1400; cf.Q.value = 0.9;
    var cg = audioCtx.createGain();
    cg.gain.setValueAtTime(0.5, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    click.connect(cf); cf.connect(cg); cg.connect(out);
    click.start(t); click.stop(t + 0.03);
  }

  function playSnare(t, dest, vel) {
    var out = voiceBus(dest, vel);

    var noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuf;
    var bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 2000; bp.Q.value = 0.7;
    var ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.5, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    noise.connect(bp); bp.connect(ng); ng.connect(out);
    noise.start(t); noise.stop(t + 0.18);

    var sizzle = audioCtx.createBufferSource();
    sizzle.buffer = noiseBuf;
    var hp = audioCtx.createBiquadFilter();
    hp.type = "highpass"; hp.frequency.value = 5500;
    var hg = audioCtx.createGain();
    hg.gain.setValueAtTime(0.22, t);
    hg.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    sizzle.connect(hp); hp.connect(hg); hg.connect(out);
    sizzle.start(t); sizzle.stop(t + 0.1);

    [188, 224].forEach(function (f, i) {
      var osc = audioCtx.createOscillator();
      osc.type = "triangle"; osc.frequency.value = f;
      var og = audioCtx.createGain();
      og.gain.setValueAtTime(i === 0 ? 0.3 : 0.22, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      osc.connect(og); og.connect(out);
      osc.start(t); osc.stop(t + 0.11);
    });
  }

  /* 钹：中国式对击钹，明亮炸开，余音约 1 秒 */
  function playBo(t, dest, vel) {
    var out = voiceBus(dest, vel);
    var bus = audioCtx.createGain();
    bus.gain.value = 0.9;
    var bp = audioCtx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = 4200; bp.Q.value = 0.5;
    bus.connect(bp); bp.connect(out);

    [
      { r: 1.00, d: 1.1,  g: 0.50 },
      { r: 1.34, d: 0.9,  g: 0.38 },
      { r: 1.67, d: 0.75, g: 0.30 },
      { r: 2.14, d: 0.6,  g: 0.24 },
      { r: 2.74, d: 0.45, g: 0.18 },
      { r: 3.36, d: 0.32, g: 0.13 },
      { r: 4.21, d: 0.22, g: 0.09 }
    ].forEach(function (p) {
      [-0.004, 0.004].forEach(function (detune) {
        var osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(420 * p.r * (1 + detune) * 1.12, t);
        osc.frequency.exponentialRampToValueAtTime(420 * p.r * (1 + detune), t + 0.03);
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(p.g * 0.5, t);
        g.gain.exponentialRampToValueAtTime(0.0006, t + p.d);
        osc.connect(g); g.connect(bus);
        osc.start(t); osc.stop(t + p.d + 0.05);
      });
    });

    var crash = audioCtx.createBufferSource();
    crash.buffer = noiseBuf;
    var cf = audioCtx.createBiquadFilter();
    cf.type = "highpass"; cf.frequency.value = 5000;
    var cg = audioCtx.createGain();
    cg.gain.setValueAtTime(0.5, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    crash.connect(cf); cf.connect(cg); cg.connect(out);
    crash.start(t); crash.stop(t + 0.25);
  }

  /* 大锣：锣声标志性下滑，余音悠长 */
  function playDaluo(t, dest, vel) {
    var out = voiceBus(dest, vel);

    /* 槌击 */
    var th = audioCtx.createBufferSource();
    th.buffer = noiseBuf;
    var tf = audioCtx.createBiquadFilter();
    tf.type = "lowpass"; tf.frequency.value = 900;
    var tg = audioCtx.createGain();
    tg.gain.setValueAtTime(0.55, t);
    tg.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    th.connect(tf); tf.connect(tg); tg.connect(out);
    th.start(t); th.stop(t + 0.09);

    var base = 146;
    [
      { r: 1.00, d: 2.4, g: 0.55 },
      { r: 1.19, d: 2.0, g: 0.40 },
      { r: 1.50, d: 1.7, g: 0.32 },
      { r: 1.98, d: 1.3, g: 0.24 },
      { r: 2.56, d: 1.0, g: 0.17 },
      { r: 3.31, d: 0.7, g: 0.12 },
      { r: 4.24, d: 0.45, g: 0.08 }
    ].forEach(function (p) {
      [-0.003, 0.003].forEach(function (detune) {
        var osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(base * p.r * (1 + detune) * 1.07, t);
        osc.frequency.exponentialRampToValueAtTime(base * p.r * (1 + detune), t + 0.45);
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(p.g * 0.5, t);
        g.gain.exponentialRampToValueAtTime(0.0006, t + p.d);
        osc.connect(g); g.connect(out);
        osc.start(t); osc.stop(t + p.d + 0.05);
      });
    });
  }

  function playWood(t, dest, vel) {
    var out = voiceBus(dest, vel);

    [
      { freq: 520,  decay: 0.1,  gain: 0.62 },
      { freq: 1380, decay: 0.06, gain: 0.3 }
    ].forEach(function (p) {
      var osc = audioCtx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(p.freq * 1.18, t);
      osc.frequency.exponentialRampToValueAtTime(p.freq, t + 0.018);
      var g = audioCtx.createGain();
      g.gain.setValueAtTime(p.gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + p.decay);
      osc.connect(g); g.connect(out);
      osc.start(t); osc.stop(t + p.decay + 0.02);
    });

    var click = audioCtx.createBufferSource();
    click.buffer = noiseBuf;
    var cf = audioCtx.createBiquadFilter();
    cf.type = "bandpass"; cf.frequency.value = 2100; cf.Q.value = 1.6;
    var cg = audioCtx.createGain();
    cg.gain.setValueAtTime(0.32, t);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.014);
    click.connect(cf); cf.connect(cg); cg.connect(out);
    click.start(t); click.stop(t + 0.02);
  }

  function playBell(t, dest, vel, freq) {
    var out = voiceBus(dest, vel);
    var bus = audioCtx.createGain();
    bus.gain.value = 0.85;
    var lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = Math.min(11000, freq * 9);
    bus.connect(lp); lp.connect(out);

    [
      { r: 1.00, d: 2.0,  g: 0.50 },
      { r: 2.01, d: 1.5,  g: 0.34 },
      { r: 2.99, d: 1.1,  g: 0.24 },
      { r: 4.20, d: 0.75, g: 0.17 },
      { r: 5.36, d: 0.5,  g: 0.11 },
      { r: 6.83, d: 0.32, g: 0.07 },
      { r: 8.93, d: 0.2,  g: 0.045 }
    ].forEach(function (p) {
      var d = p.d * state.bellDecay;
      [-0.0035, 0.0035].forEach(function (detune) {
        var osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = freq * p.r * (1 + detune);
        var g = audioCtx.createGain();
        g.gain.setValueAtTime(p.g * 0.5, t);
        g.gain.exponentialRampToValueAtTime(0.0006, t + d);
        osc.connect(g); g.connect(bus);
        osc.start(t); osc.stop(t + d + 0.05);
      });
    });

    var strike = audioCtx.createBufferSource();
    strike.buffer = noiseBuf;
    var sf = audioCtx.createBiquadFilter();
    sf.type = "bandpass"; sf.frequency.value = freq * 2.5; sf.Q.value = 3;
    var sg = audioCtx.createGain();
    sg.gain.setValueAtTime(0.3, t);
    sg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    strike.connect(sf); sf.connect(sg); sg.connect(out);
    strike.start(t); strike.stop(t + 0.03);

    var sparkle = audioCtx.createBufferSource();
    sparkle.buffer = noiseBuf;
    var kf = audioCtx.createBiquadFilter();
    kf.type = "highpass"; kf.frequency.value = 7000;
    var kg = audioCtx.createGain();
    kg.gain.setValueAtTime(0.16, t);
    kg.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
    sparkle.connect(kf); kf.connect(kg); kg.connect(out);
    sparkle.start(t); sparkle.stop(t + 0.05);
  }

  var PLAYERS = {
    kick: playKick,
    snare: playSnare,
    bo: playBo,
    daluo: playDaluo,
    wood: playWood
  };

  function playSound(id, t, vel) {
    if (!audioCtx || !masterGain) return;
    var dest = trackGains[id] || masterGain;
    var track = TRACK_BY_ID[id];
    if (track && track.freq) playBell(t, dest, vel, track.freq);
    else if (PLAYERS[id]) PLAYERS[id](t, dest, vel);
  }

  function floatPlusOne() {

    s.className = "float-plus";
    s.textContent = "功德 +1";

  /* 木鱼图缺失时回退为素色鼓面，不影响敲击 */

  function knockMuyu() {
    ensureAudio();
    if (!audioCtx) return;
    playSound("wood", audioCtx.currentTime, 1.0);
    var m = state.merit;
    var t = todayStr();
    if (m.day !== t) { m.day = t; m.dayCount = 0; }
    m.dayCount++;
    m.total++;
    var now = Date.now();
    if (now - (m._last || 0) < 1200) m._combo = (m._combo || 0) + 1;
    else m._combo = 1;
    m._last = now;
    if (m._combo > (m.maxCombo || 0)) m.maxCombo = m._combo;
    persist();
    renderMerit();
    floatPlusOne();
    triggerPulse(muyuFish);
    /* 木槌落下 + 鱼身微震 + 冲击波纹 */
    muyuMallet.classList.remove("hit");
    void muyuMallet.offsetWidth;
    muyuMallet.classList.add("hit");
    muyuFish.classList.remove("thump");
    void muyuFish.offsetWidth;
    muyuFish.classList.add("thump");
    shockWave();
    comboLine.textContent = m._combo >= 5 ? "连击 ×" + m._combo + " · 心诚则灵" : "";
  }

  muyuFish.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;

  /* ---------- 录音 ---------- */
  var recBtn = document.getElementById("recBtn");
  var mediaRec = null, recChunks = [], isRec = false;

  function pickMime() {
    if (!window.MediaRecorder) return null;
    var list = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    for (var i = 0; i < list.length; i++) {
      try { if (MediaRecorder.isTypeSupported(list[i])) return list[i]; } catch (e) {}
    }
    return null;
  }

  function setRecUI(on) {
    isRec = on;
    recBtn.classList.toggle("on", on);
    recBtn.innerHTML = on ? '<span class="dot"></span>停止' : '<span class="dot"></span>录音';
  }

  function finishRec() {
    setRecUI(false);
    if (!recChunks.length) { toast("没有录到声音"); return; }
    var blob = new Blob(recChunks, { type: mediaRec.mimeType || "audio/webm" });
    var ext = (mediaRec.mimeType || "").indexOf("mp4") >= 0 ? "m4a" : "webm";
    var file = new File([blob], "zhonggulou-" + Date.now() + "." + ext, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: "钟鼓楼·录音" }).catch(function () {});
    } else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      toast("录音已下载");
    }
    recChunks = [];
  }

  recBtn.addEventListener("click", function () {
    if (isRec) {
      try { mediaRec.stop(); } catch (e) { setRecUI(false); }
      return;
    }
    ensureAudio();
    if (!audioCtx || !recDest) { toast("音频尚未就绪"); return; }
    var mime = pickMime();
    if (!mime) { toast("当前浏览器不支持录音"); return; }
    recChunks = [];
    try {
      mediaRec = new MediaRecorder(recDest.stream, { mimeType: mime });
    } catch (e) { toast("录音启动失败"); return; }
    mediaRec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
    mediaRec.onstop = finishRec;
    mediaRec.start();
    setRecUI(true);
    toast("录音中，再点一次停止");
  });

  /* ---------- 鼓垫（图片 + CSS 回退） ---------- */
  var padsEl = document.getElementById("pads");
  var padElsById = {};
  var keyToPad = {};
  var lastHitAt = {};
  var rollTimers = {};
  var ROLL_INTERVAL = 170;

  function hitPad(id) {
    var now = Date.now();
    if (now - (lastHitAt[id] || 0) < 45) return;
    lastHitAt[id] = now;
    ensureAudio();
    if (!audioCtx) return;
    playSound(id, audioCtx.currentTime, 1.0);
    triggerPulse(padElsById[id]);
  }

  function startRoll(id) {
    if (rollTimers[id]) return;
    hitPad(id);
    rollTimers[id] = setInterval(function () { hitPad(id); }, ROLL_INTERVAL);
  }

  function stopRoll(id) {
    if (!rollTimers[id]) return;
    clearInterval(rollTimers[id]);
    delete rollTimers[id];
  }

  var activePointerPad = {};

  TRACKS.forEach(function (p) {
    var btn = document.createElement("button");
    btn.className = "pad " + p.shape;
    btn.setAttribute("aria-label", p.label);
    /* 图片优先：images/icon-<id>.webp；缺图/加载失败时自动脱落，露出 CSS 绘制的编号 */
    var img = document.createElement("img");
    img.src = "images/icon-" + p.id + ".webp";
    img.alt = p.label;
    img.draggable = false;
    img.addEventListener("error", function () { img.remove(); });
    btn.appendChild(img);
    var num = document.createElement("span");
    num.className = "num";
    num.textContent = p.key;
    var nm = document.createElement("span");
    nm.className = "name";
    nm.textContent = p.label;
    btn.appendChild(num);
    btn.appendChild(nm);
    wirePulse(btn);
    btn.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      activePointerPad[e.pointerId] = p.id;
      startRoll(p.id);
    });
    btn.addEventListener("pointerleave", function () { stopRoll(p.id); });
    btn.addEventListener("click", function (e) { if (e.detail === 0) hitPad(p.id); });
    padsEl.appendChild(btn);
    padElsById[p.id] = btn;
    keyToPad[p.key] = p.id;
  });

  ["pointerup", "pointercancel"].forEach(function (evt) {
    document.addEventListener(evt, function (e) {
      var id = activePointerPad[e.pointerId];
      if (!id) return;
      stopRoll(id);
      delete activePointerPad[e.pointerId];
    });
  });

  window.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    var id = keyToPad[e.key];
    if (!id) return;
    if (state.view === "seq") startRoll(id);
    else if (id === "wood") knockMuyu();
  });
  window.addEventListener("keyup", function (e) {
    var id = keyToPad[e.key];
    if (!id) return;
    stopRoll(id);
  });
  window.addEventListener("blur", function () {
    Object.keys(rollTimers).forEach(stopRoll);
    activePointerPad = {};
  });

  /* Mixer */
  var mixerGrid = document.getElementById("mixerGrid");

  function addSlider(container, cls, labelText, min, max, step, value, fmt, onInput) {
    var row = document.createElement("div");
    row.className = "mixer-row" + (cls ? " " + cls : "");
    var label = document.createElement("span");
    label.className = "m-label";
    label.textContent = labelText;
    var input = document.createElement("input");
    input.type = "range";
    input.min = min; input.max = max; input.step = step; input.value = value;
    var val = document.createElement("span");
    val.className = "m-val";
    val.textContent = fmt(value);
    input.addEventListener("input", function () {
      var v = parseFloat(input.value);
      val.textContent = fmt(v);
      onInput(v);
    });
    row.appendChild(label);
    row.appendChild(input);
    row.appendChild(val);
    container.appendChild(row);
  }

  function pct(v) { return Math.round(v * 100) + "%"; }
  function divider() {
    var d = document.createElement("div");
    d.className = "mixer-divider";
    mixerGrid.appendChild(d);
  }

  addSlider(mixerGrid, "", "主音量", 0, 1.2, 0.01, state.masterVol, pct, function (v) {
    state.masterVol = v;
    if (masterGain) masterGain.gain.value = v;
    persist();
  });
  divider();
  TRACKS.forEach(function (t) {
    addSlider(mixerGrid, t.shape, t.label, 0, 1.3, 0.01, state.trackVol[t.id], pct, function (v) {
      state.trackVol[t.id] = v;
      if (trackGains[t.id]) trackGains[t.id].gain.value = v;
      persist();
    });
  });
  divider();
  addSlider(mixerGrid, "bell", "编钟延音", 0.3, 2.5, 0.05, state.bellDecay,
    function (v) { return v.toFixed(2) + "×"; },
    function (v) { state.bellDecay = v; persist(); });

  /* Slots */
  var slotsEl = document.getElementById("slots");
  var slotButtons = [];
  SLOT_NAMES.forEach(function (name, idx) {
    var btn = document.createElement("button");
    btn.className = "slot-btn btn3d" + (idx === state.activeSlot ? " on" : "");
    btn.textContent = name;
    btn.addEventListener("click", function () {
      if (idx === state.activeSlot) return;
      state.activeSlot = idx;
      persist();
      renderActiveSlot();
      slotButtons.forEach(function (b, i) { b.classList.toggle("on", i === idx); });
    });
    slotsEl.appendChild(btn);
    slotButtons.push(btn);
  });

  /* Swing / Humanize */
  var swingInput = document.getElementById("swing");
  var swingVal = document.getElementById("swingVal");
  swingInput.value = state.swing;
  swingVal.textContent = state.swing + "%";
  swingInput.addEventListener("input", function () {
    state.swing = parseInt(swingInput.value, 10);
    swingVal.textContent = state.swing + "%";
    persist();
  });

  var humanizeBtn = document.getElementById("humanizeBtn");
  humanizeBtn.classList.toggle("on", state.humanize);
  humanizeBtn.addEventListener("click", function () {
    state.humanize = !state.humanize;
    humanizeBtn.classList.toggle("on", state.humanize);
    persist();
  });

  /* 预置锣鼓点 */
  var presetScroll = document.getElementById("presetScroll");
  PRESETS.forEach(function (p) {
    var chip = document.createElement("button");
    chip.className = "preset-chip";
    chip.innerHTML = "";
    var nm = document.createElement("div");
    nm.textContent = p.name;
    var ds = document.createElement("small");
    ds.textContent = p.desc + " · " + p.tempo + "拍/分";
    chip.appendChild(nm);
    chip.appendChild(ds);
    chip.addEventListener("click", function () {
      var slot = activeSlot();
      TRACKS.forEach(function (t) { slot.steps[t.id] = new Array(NUM_STEPS).fill(false); });
      Object.keys(p.steps).forEach(function (id) {
        if (!TRACK_BY_ID[id]) return;
        p.steps[id].forEach(function (i) {
          if (i >= 0 && i < NUM_STEPS) slot.steps[id][i] = true;
        });
      });
      slot.tempo = p.tempo;
      renderActiveSlot();
      persist();
      toast("已载入「" + p.name + "」到图案 " + SLOT_NAMES[state.activeSlot]);
    });
    presetScroll.appendChild(chip);
  });

  /* Sequencer */
  var seqEl = document.getElementById("sequencer");
  var seqScroll = document.getElementById("seqScroll");
  var seqWrap = document.getElementById("seqWrap");
  var stepEls = {};
  var playBtn = document.getElementById("playBtn");
  var tempoInput = document.getElementById("tempo");
  var tempoVal = document.getElementById("tempoVal");

  TRACKS.forEach(function (track) {
    var label = document.createElement("div");
    label.className = "row-label " + track.shape + (track.pitch ? " " + track.pitch : "");
    label.textContent = track.label;
    seqEl.appendChild(label);

    stepEls[track.id] = [];
    for (var i = 0; i < NUM_STEPS; i++) {
      var btn = document.createElement("button");
      btn.className = "step " + track.shape + (track.pitch ? " " + track.pitch : "");
      if (i % 4 === 3 && i !== NUM_STEPS - 1) btn.setAttribute("data-g", "1");
      wirePulse(btn);
      (function (trackId, idx, button) {
        button.addEventListener("click", function () {
          var slot = activeSlot();
          var val = !slot.steps[trackId][idx];
          slot.steps[trackId][idx] = val;
          button.classList.toggle("active", val);
          triggerPulse(button);
          persist();
        });
      })(track.id, i, btn);
      seqEl.appendChild(btn);
      stepEls[track.id].push(btn);
    }
  });

  function renderActiveSlot() {
    var slot = activeSlot();
    tempoInput.value = slot.tempo;
    tempoVal.textContent = slot.tempo + " 拍/分";
    TRACKS.forEach(function (track) {
      for (var i = 0; i < NUM_STEPS; i++)
        stepEls[track.id][i].classList.toggle("active", !!slot.steps[track.id][i]);
    });
  }

  function updateScrollFade() {
    if (!seqScroll) return;
    var atEnd = seqScroll.scrollLeft + seqScroll.clientWidth >= seqScroll.scrollWidth - 2;
    seqWrap.classList.toggle("at-end", atEnd);
  }
  seqScroll.addEventListener("scroll", updateScrollFade);
  window.addEventListener("resize", updateScrollFade);

  function applyOrientation() {
    var landscape = window.matchMedia("(orientation: landscape)").matches;
    document.documentElement.setAttribute("data-orient", landscape ? "landscape" : "portrait");
    document.body.classList.add("is-rotating");
    clearTimeout(applyOrientation._t);
    applyOrientation._t = setTimeout(function () {
      document.body.classList.remove("is-rotating");
      updateScrollFade();
    }, 320);
  }
  applyOrientation();
  window.addEventListener("orientationchange", applyOrientation);
  window.matchMedia("(orientation: landscape)").addEventListener("change", applyOrientation);

  /* Transport */
  var isPlaying = false;
  var currentStep = 0;
  var nextStepTime = 0;
  var lookaheadMs = 25;
  var scheduleAhead = 0.1;
  var timerId = null;
  var noteQueue = [];

  renderActiveSlot();
  requestAnimationFrame(updateScrollFade);

  tempoInput.addEventListener("input", function () {
    var v = parseInt(tempoInput.value, 10);
    activeSlot().tempo = v;
    tempoVal.textContent = v + " 拍/分";
    persist();
  });

  function secondsPerStep() { return 60 / activeSlot().tempo / 4; }

  function scheduleStep(step, baseTime) {
    var swingOffset = (step % 2 === 1) ? secondsPerStep() * (state.swing / 100) : 0;
    var jitter = state.humanize ? (Math.random() - 0.5) * 0.018 : 0;
    var time = baseTime + swingOffset + jitter;
    noteQueue.push({ step: step, time: time });
    var slot = activeSlot();
    TRACKS.forEach(function (track) {
      if (slot.steps[track.id][step]) {
        var vel = state.humanize ? 0.85 + Math.random() * 0.3 : 1.0;
        playSound(track.id, time, vel);
      }
    });
  }

  function advanceStep() {
    nextStepTime += secondsPerStep();
    currentStep = (currentStep + 1) % NUM_STEPS;
  }

  function scheduler() {
    if (nextStepTime < audioCtx.currentTime - 0.05) {
      nextStepTime = audioCtx.currentTime + 0.05;
      noteQueue = [];
    }
    while (nextStepTime < audioCtx.currentTime + scheduleAhead) {
      scheduleStep(currentStep, nextStepTime);
      advanceStep();
    }
    timerId = setTimeout(scheduler, lookaheadMs);
  }

  function clearPlayhead() {
    TRACKS.forEach(function (track) {
      stepEls[track.id].forEach(function (el) { el.classList.remove("playhead"); });
    });
  }

  function drawLoop() {
    if (audioCtx && isPlaying) {
      var now = audioCtx.currentTime;
      var latest = null;
      while (noteQueue.length && noteQueue[0].time <= now)
        latest = noteQueue.shift().step;
      if (latest !== null) {
        clearPlayhead();
        TRACKS.forEach(function (track) { stepEls[track.id][latest].classList.add("playhead"); });
      }
    }
    requestAnimationFrame(drawLoop);
  }
  requestAnimationFrame(drawLoop);

  function startSeq() {
    if (isPlaying) return;
    ensureAudio();
    if (!audioCtx) return;
    isPlaying = true;
    currentStep = 0;
    noteQueue = [];
    nextStepTime = audioCtx.currentTime + 0.05;
    scheduler();
    playBtn.innerHTML = '<span class="pause-bars" aria-hidden="true"><i></i><i></i></span>';
    playBtn.setAttribute("aria-label", "暂停");
  }

  function stopSeq() {
    isPlaying = false;
    clearTimeout(timerId);
    clearPlayhead();
    playBtn.textContent = "▶";
    playBtn.setAttribute("aria-label", "播放");
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden && isPlaying) stopSeq();
  });

  wirePulse(playBtn);
  var lastToggle = 0;
  function togglePlay() {
    var now = Date.now();
    if (now - lastToggle < 50) return;
    lastToggle = now;
    ensureAudio();
    triggerPulse(playBtn);
    if (isPlaying) stopSeq(); else startSeq();
  }
  playBtn.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    togglePlay();
  });
  playBtn.addEventListener("click", function (e) { if (e.detail === 0) togglePlay(); });

  document.getElementById("clearBtn").addEventListener("click", function () {
    var slot = activeSlot();
    TRACKS.forEach(function (track) {
      slot.steps[track.id] = new Array(NUM_STEPS).fill(false);
      stepEls[track.id].forEach(function (el) { el.classList.remove("active"); });
    });
    persist();
  });

  document.getElementById("randomBtn").addEventListener("click", function () {
    var density = {
      kick: 0.28, snare: 0.22, bo: 0.3, daluo: 0.1,
      wood: 0.18, bellHigh: 0.14, bellMid: 0.14, bellLow: 0.1
    };
    var slot = activeSlot();
    TRACKS.forEach(function (track) {
      var p = density[track.id] || 0.2;
      for (var i = 0; i < NUM_STEPS; i++) {
        var val = Math.random() < p;
        slot.steps[track.id][i] = val;
        stepEls[track.id][i].classList.toggle("active", val);
      }
    });
    persist();
  });

  /* 初始化 */
  setView(state.view === "seq" ? "seq" : "muyu");
  renderMerit();
})();
</script>
</body>
</html>
